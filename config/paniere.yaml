# ============================================================
# Paniere di monitoraggio — alert intraday e SL/TP
# ============================================================
#
# Tutti gli `entry_price` sono in EUR (come visualizzati su Trade Republic).
# Il poller converte automaticamente i prezzi yfinance da valuta nativa
# (USD/GBP/AUD/KRW) in EUR usando il cambio di yfinance, così SL/TP %
# corrispondono a quelli che vedi sul tuo broker.
#
# Soglie per categoria:
#   Mega cap          : SL -10% / TP +25%
#   Mid cap semi      : SL -12% / TP +30%
#   Spec volatile     : SL -20% / TP +50%
#   ETF diversificato : SL  -8% / TP +20%
#   ETF tematico      : SL -15% / TP +35%
#   Asia primary      : SL -15% / TP +30%
#
# Soglie intraday: variano per asset (vedi commenti inline).
# Cooldown 4h tra alert ripetuti sulla stessa condizione.

defaults:
  cooldown_hours: 4
  intraday_threshold_pct: 3.0

market_hours_utc:
  - { name: "BIT", start: "06:30", end: "16:30", days: [0,1,2,3,4] }
  - { name: "US",  start: "13:00", end: "21:00", days: [0,1,2,3,4] }

